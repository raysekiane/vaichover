<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vaichover">
  <meta name="theme-color" id="meta-theme" content="#c0392b">
  <script>
    try {
      const saved = localStorage.getItem("vw_theme");
      if (saved) document.getElementById("meta-theme").content = saved;
      const danger = localStorage.getItem("vw_danger") === "1";
      document.addEventListener("DOMContentLoaded", () => {
        const h = document.getElementById("header");
        if (h) h.className = `app-bg ${danger ? "danger" : "ok"}`;
      });
    } catch(_) {}
  </script>
  <title>Vaichover?</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.jpg">
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --radius: 18px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: #1a0d0d;
    }

    /* ── Setup ── */
    #setup {
      display: none;
      padding: 3rem 1.5rem 2rem;
      min-height: 100dvh;
      flex-direction: column;
      gap: 1.75rem;
      background: #0f172a;
      color: #e2e8f0;
    }
    #setup.active { display: flex; }
    .setup-logo { font-size: 3rem; }
    .setup-title { font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: -0.04em; }
    .setup-sub { color: #64748b; line-height: 1.55; font-size: 0.95rem; }
    label {
      display: block; font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: #475569; margin-bottom: 0.5rem;
    }
    input {
      width: 100%; padding: 0.875rem 1rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; font-size: 1rem;
      color: #e2e8f0; background: rgba(255,255,255,0.06);
      outline: none; transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    input:focus { border-color: rgba(255,255,255,0.3); }
    .help { font-size: 0.78rem; color: #475569; margin-top: 0.4rem; }
    .help a { color: #93c5fd; text-decoration: none; }
    .btn {
      width: 100%; padding: 1rem;
      background: rgba(255,255,255,0.12);
      color: #fff; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.7; }
    .btn-ghost { background: transparent; color: #64748b; border: 1px solid rgba(255,255,255,0.08); }

    /* ── Loading ── */
    #loading {
      display: none; justify-content: center; align-items: center;
      min-height: 100dvh; flex-direction: column; gap: 1rem;
      background: #1a0d0d; color: rgba(255,255,255,0.4);
    }
    #loading.active { display: flex; }
    .spinner {
      width: 44px; height: 44px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.5);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    /* ── Error ── */
    #error {
      display: none; padding: 3rem 1.5rem;
      min-height: 100dvh; flex-direction: column;
      justify-content: center; gap: 1rem;
      background: #1a0d0d; color: #e2e8f0;
    }
    #error.active { display: flex; }
    .error-emoji { font-size: 3rem; }
    .error-title { font-size: 1.25rem; font-weight: 700; }
    .error-msg { color: rgba(255,255,255,0.4); line-height: 1.55; }

    /* ── App ── */
    #app { display: none; }
    #app.active { display: block; }

    .app-bg {
      min-height: 100dvh;
      padding: 3rem 1.25rem 3rem;
      display: flex; flex-direction: column; gap: 0.875rem;
      transition: background 0.6s ease;
    }
    .app-bg.ok {
      background: linear-gradient(175deg, #0c2461 0%, #1a4a9b 22%, #0d2547 65%, #060f22 100%);
    }
    .app-bg.danger {
      background: linear-gradient(175deg, #6b1414 0%, #9b2020 22%, #3a1a1a 65%, #1a0d0d 100%);
    }

    /* Top row */
    .header-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .city-name { font-size: 0.7rem; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
    .app-name  { font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: -0.04em; }
    .icon-btn {
      background: rgba(255,255,255,0.1); border: none; color: rgba(255,255,255,0.7);
      width: 38px; height: 38px; border-radius: 50%; font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
    }
    .icon-btn:active { background: rgba(255,255,255,0.2); }
    .icon-btn.spinning { animation: spin 0.75s linear infinite; }

    /* Big temp */
    .w-hero { display: flex; align-items: flex-end; gap: 0.75rem; margin: 0.5rem 0 0.25rem; }
    .w-emoji { font-size: 3rem; line-height: 1; }
    .w-temp  { font-size: 5rem; font-weight: 200; color: #fff; line-height: 1; letter-spacing: -0.04em; }
    .w-temp sup { font-size: 1.5rem; font-weight: 300; vertical-align: super; }
    .w-desc  { font-size: 0.95rem; color: rgba(255,255,255,0.55); font-weight: 400; text-transform: capitalize; }
    .w-feel-row { font-size: 0.8rem; color: rgba(255,255,255,0.35); margin-top: 0.15rem; }

    /* Glass card base */
    .glass {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Timeline */
    .timeline-scroll {
      display: flex; justify-content: space-evenly;
      padding: 0.875rem 0.5rem; overflow: hidden;
    }
    .timeline-item {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      align-items: center; gap: 0.3rem;
    }
    .timeline-time { font-size: 0.6rem; font-weight: 600; color: rgba(255,255,255,0.45); letter-spacing: 0.04em; }
    .timeline-icon { font-size: 1.3rem; line-height: 1; }
    .timeline-temp { font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.85); }

    /* Stats grid */
    .w-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
    }
    .w-stat { padding: 0.625rem 0.875rem; }
    .w-stat-label { font-size: 0.55rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
    .w-stat-value { font-size: 1rem; font-weight: 600; color: #fff; margin-top: 0.2rem; }

    /* Alert banner */
    .alert-banner {
      padding: 1rem 1.125rem;
      display: flex; align-items: center; gap: 0.875rem;
    }
    .alert-icon  { font-size: 1.6rem; flex-shrink: 0; }
    .alert-title { font-size: 0.95rem; font-weight: 700; color: #fff; line-height: 1.3; }
    .alert-sub   { font-size: 0.72rem; color: rgba(255,255,255,0.45); margin-top: 0.25rem; }

    /* Section title */
    .section-title {
      font-size: 0.55rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: rgba(255,255,255,0.25); margin-bottom: 0.6rem;
    }

    /* Windows grid */
    .windows-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .window-card { padding: 0.875rem; transition: background 0.3s, border-color 0.3s; }
    .window-card.danger {
      background: rgba(180,30,30,0.3) !important;
      border-color: rgba(255,100,100,0.2) !important;
    }
    .window-card.full-width { grid-column: 1 / -1; }
    .wc-icon   { font-size: 1.3rem; margin-bottom: 0.4rem; }
    .wc-name   { font-size: 0.65rem; font-weight: 500; color: rgba(255,255,255,0.35); margin-bottom: 0.3rem; letter-spacing: 0.02em; }
    .wc-status { font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.4); }
    .window-card.danger .wc-status { color: #ff8080; }
    .wc-reason { font-size: 0.65rem; color: rgba(255,255,255,0.25); margin-top: 0.2rem; }

    .updated-time {
      text-align: center; font-size: 0.7rem;
      color: rgba(255,255,255,0.2); padding-top: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── Setup ── -->
<div id="setup">
  <div>
    <div class="setup-logo">🏠</div>
    <div class="setup-title">Vaichover?</div>
    <p class="setup-sub" style="margin-top:0.5rem">Configure uma vez. Nunca mais cheque email para saber se fecha a janela.</p>
  </div>

  <div>
    <label for="inp-key">Chave OpenWeatherMap</label>
    <input type="text" id="inp-key" placeholder="Cole sua chave aqui" autocomplete="off" autocorrect="off" spellcheck="false">
    <p class="help">Crie grátis em <a href="https://openweathermap.org/api" target="_blank" rel="noopener">openweathermap.org/api</a></p>
  </div>

  <div>
    <label for="inp-city">Cidade</label>
    <input type="text" id="inp-city" placeholder="Florianopolis,BR" value="Florianopolis,BR" autocorrect="off" spellcheck="false">
    <p class="help">Formato: NomeDaCidade,BR</p>
  </div>

  <button class="btn" onclick="salvarConfig()">Salvar e Abrir</button>
</div>

<!-- ── Loading ── -->
<div id="loading" class="active">
  <div class="spinner"></div>
  <span>Verificando janelas…</span>
</div>

<!-- ── Error ── -->
<div id="error">
  <div class="error-emoji">😬</div>
  <div class="error-title">Algo deu errado</div>
  <p class="error-msg" id="error-msg"></p>
  <div style="display:flex;flex-direction:column;gap:0.75rem;margin-top:0.5rem">
    <button class="btn" onclick="carregar()">Tentar novamente</button>
    <button class="btn btn-ghost" onclick="mostrarSetup()">Reconfigurar</button>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <div class="app-bg danger" id="header">

    <!-- Top row -->
    <div class="header-row">
      <div>
        <div class="city-name" id="city-name"></div>
        <div class="app-name">Vaichover?</div>
      </div>
      <button class="icon-btn" id="refresh-btn" onclick="carregar()" title="Atualizar">↻</button>
    </div>

    <!-- Big temperature -->
    <div class="w-hero">
      <div class="w-emoji" id="w-emoji">—</div>
      <div class="w-temp" id="w-temp">—<sup>°</sup></div>
    </div>
    <div class="w-desc" id="w-desc"></div>
    <div class="w-feel-row">Sensação <span id="w-feel">—</span> · Umidade <span id="w-hum">—</span></div>

    <!-- Timeline -->
    <div class="glass" style="margin-top:0.5rem">
      <div class="timeline-scroll" id="timeline"></div>
    </div>

    <!-- Stats -->
    <div class="w-stats">
      <div class="w-stat glass"><div class="w-stat-label">Vento</div><div class="w-stat-value" id="w-wind">—</div></div>
      <div class="w-stat glass"><div class="w-stat-label">Direção</div><div class="w-stat-value" id="w-dir">—</div></div>
    </div>

    <!-- Alert -->
    <div class="alert-banner glass" id="alert-banner">
      <div class="alert-icon" id="alert-icon">—</div>
      <div>
        <div class="alert-title" id="alert-title"></div>
        <div class="alert-sub" id="alert-sub"></div>
      </div>
    </div>

    <!-- Windows -->
    <div>
      <div class="section-title">Status das janelas</div>
      <div class="windows-grid" id="windows-grid"></div>
    </div>

    <div class="updated-time" id="updated-time"></div>
  </div>
</div>

<script>
  const WINDOWS = [
    { id: 1, name: "Sala",           icon: "🛋️", dMin:  60, dMax: 200 },
    { id: 2, name: "Escrit. Pati",   icon: "💼", dMin:  60, dMax: 200 },
    { id: 3, name: "Quarto",         icon: "🛏️", dMin:  60, dMax: 200 },
    { id: 4, name: "Escrit. Ra",     icon: "💻", dMin:  60, dMax: 200 },
    { id: 5, name: "Área de Serviço",icon: "🧺", dMin: 160, dMax: 270 },
  ];

  const WEATHER_EMOJI = {
    Thunderstorm: "⛈️", Drizzle: "🌦️", Rain: "🌧️",
    Snow: "❄️", Clear: "☀️", Clouds: "☁️",
    Mist: "🌫️", Fog: "🌫️", Haze: "🌫️",
  };

  const DIRS = ["Norte","Nordeste","Leste","Sudeste","Sul","Sudoeste","Oeste","Noroeste"];

  // ── State helpers ──────────────────────────────────────────────

  function getConfig() {
    return {
      apiKey: localStorage.getItem("vw_key"),
      city:   localStorage.getItem("vw_city") || "Florianopolis,BR",
    };
  }

  function show(id) {
    ["setup","loading","error","app"].forEach(s =>
      document.getElementById(s).classList.toggle("active", s === id)
    );
  }

  function mostrarSetup() {
    const cfg = getConfig();
    if (cfg.apiKey) document.getElementById("inp-key").value = cfg.apiKey;
    document.getElementById("inp-city").value = cfg.city;
    show("setup");
  }

  function salvarConfig() {
    const key  = document.getElementById("inp-key").value.trim();
    const city = document.getElementById("inp-city").value.trim();
    if (!key)  { alert("Insira a chave da API."); return; }
    if (!city) { alert("Insira a cidade."); return; }
    localStorage.setItem("vw_key",  key);
    localStorage.setItem("vw_city", city);
    carregar();
  }

  // ── Window logic (same rules as GAS) ──────────────────────────

  function calcWindows(deg, kmh, rain) {
    const danger = rain || kmh > 15;
    return WINDOWS.map(w => {
      const affected = danger && deg > w.dMin && deg < w.dMax;
      return {
        ...w,
        close:  affected,
        reason: affected ? (rain ? "Chuva prevista" : `Vento ${kmh} km/h`) : "",
      };
    });
  }

  function gerarTimeline(list, maxItens = 6) {
    const agora = new Date();
    const tsAgora = agora.getTime();

    const futuros = list
      .filter(item => (item.dt * 1000 + 3 * 3600 * 1000) > tsAgora)
      .slice(0, maxItens);

    return futuros.map((item, i) => {
      const dt = new Date(item.dt * 1000);
      const hora = dt.getHours();
      const main = item.weather[0].main;
      return {
        label: i === 0 ? "Agora" : `${String(hora).padStart(2, '0')}h`,
        icon: WEATHER_EMOJI[main] || "🌡️",
        temp: Math.round(item.main.temp) + "°",
      };
    });
  }

  function analisarPrevisao(list) {
    const alerts = [];
    let periodoAtual = null;

    list.forEach(item => {
      const hora = new Date(item.dt * 1000).getHours();
      const temChuva = item.weather.some(w => ["Rain","Drizzle","Thunderstorm"].includes(w.main));

      // Filtra apenas entre 7h-19h
      if (hora < 7 || hora >= 19) return;

      if (temChuva) {
        const kmh = Math.round(item.wind.speed * 3.6);
        const deg = item.wind.deg ?? 0;
        const windows = calcWindows(deg, kmh, true);
        const janelas = windows.filter(w => w.close).map(w => w.name);

        if (!periodoAtual) {
          periodoAtual = {
            horaInicio: hora,
            horaFim: hora,
            janelas: janelas,
          };
        } else {
          // Continua o mesmo período se a próxima hora for contígua
          if (hora === periodoAtual.horaFim + 3) {
            periodoAtual.horaFim = hora;
            // Mescla janelas únicas
            periodoAtual.janelas = [...new Set([...periodoAtual.janelas, ...janelas])];
          } else {
            // Finaliza período anterior e começa novo
            alerts.push({
              tempo: `${String(periodoAtual.horaInicio).padStart(2, '0')}h-${String(periodoAtual.horaFim + 1).padStart(2, '0')}h`,
              janelas: periodoAtual.janelas,
            });
            periodoAtual = {
              horaInicio: hora,
              horaFim: hora,
              janelas: janelas,
            };
          }
        }
      } else if (periodoAtual) {
        // Finaliza período quando não há mais chuva
        alerts.push({
          tempo: `${String(periodoAtual.horaInicio).padStart(2, '0')}h-${String(periodoAtual.horaFim + 1).padStart(2, '0')}h`,
          janelas: periodoAtual.janelas,
        });
        periodoAtual = null;
      }
    });

    // Finaliza último período se existir
    if (periodoAtual) {
      alerts.push({
        tempo: `${String(periodoAtual.horaInicio).padStart(2, '0')}h-${String(periodoAtual.horaFim + 1).padStart(2, '0')}h`,
        janelas: periodoAtual.janelas,
      });
    }

    return alerts;
  }

  // ── Fetch & render ─────────────────────────────────────────────

  async function carregar() {
    const cfg = getConfig();
    if (!cfg.apiKey) { mostrarSetup(); return; }

    show("loading");
    const btn = document.getElementById("refresh-btn");
    btn.classList.add("spinning");

    try {
      const res = await fetch(
        `https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(cfg.city)}&appid=${cfg.apiKey}&units=metric&lang=pt_br`
      );
      if (!res.ok) {
        if (res.status === 401) throw new Error("Chave de API inválida. Toque em Reconfigurar.");
        if (res.status === 404) throw new Error(`Cidade "${cfg.city}" não encontrada. Tente o formato "Cidade,BR".`);
        throw new Error(`Erro ${res.status} ao buscar dados.`);
      }
      const data = await res.json();
      localStorage.removeItem("vw_cache_legacy");
      localStorage.setItem("vw_cache", JSON.stringify({ data, ts: Date.now() }));
      renderizar(data);
    } catch (e) {
      // Erros de API conhecidos: mostrar mensagem direta sem tentar cache
      if (e.message && (e.message.includes("401") || e.message.includes("404") ||
          e.message.includes("inválida") || e.message.includes("não encontrada"))) {
        show("error");
        document.getElementById("error-msg").textContent = e.message;
      } else {
        // Erro de rede: tentar cache
        const raw = localStorage.getItem("vw_cache");
        if (raw) {
          try {
            const { data, ts } = JSON.parse(raw);
            if (!data.list) throw new Error("cache desatualizado");
            const ago = Math.round((Date.now() - ts) / 60000);
            renderizar(data, `dados de ${ago}min atrás · offline`);
          } catch (_) {
            localStorage.removeItem("vw_cache");
            show("error");
            document.getElementById("error-msg").textContent =
              "Verifique sua conexão e tente novamente.";
          }
        } else {
          show("error");
          document.getElementById("error-msg").textContent =
            e.message || "Verifique sua conexão e tente novamente.";
        }
      }
    } finally {
      btn.classList.remove("spinning");
    }
  }

  function renderizar(data, cacheNote) {
    // Extrai dados atuais (primeiro item da previsão)
    const current = data.list[0];
    const kmh     = Math.round(current.wind.speed * 3.6);
    const deg     = current.wind.deg ?? 0;
    const rain    = current.weather.some(w => ["Rain","Drizzle","Thunderstorm"].includes(w.main));
    const dirText = DIRS[Math.round(deg / 45) % 8];
    const main    = current.weather[0].main;

    // Header weather
    document.getElementById("city-name").textContent = data.city?.name ?? data.name ?? "";
    document.getElementById("w-emoji").textContent   = WEATHER_EMOJI[main] || "🌡️";
    document.getElementById("w-temp").innerHTML      = `${Math.round(current.main.temp)}<sup>°C</sup>`;
    document.getElementById("w-desc").textContent    = current.weather[0].description;
    document.getElementById("w-wind").textContent    = `${kmh} km/h`;
    document.getElementById("w-dir").textContent     = dirText;
    document.getElementById("w-hum").textContent     = `${current.main.humidity}%`;
    document.getElementById("w-feel").textContent    = `${Math.round(current.main.feels_like)}°C`;

    // Window logic — considera o dia todo para o alerta
    const diaHoje = new Date().toDateString();
    const listaHoje = data.list.filter(item => new Date(item.dt * 1000).toDateString() === diaHoje);

    const janelasEmRiscoHoje = new Set();
    let motivoAlerta = "";
    listaHoje.forEach(item => {
      const k = Math.round(item.wind.speed * 3.6);
      const d = item.wind.deg ?? 0;
      const r = item.weather.some(w => ["Rain","Drizzle","Thunderstorm"].includes(w.main));
      calcWindows(d, k, r).filter(w => w.close).forEach(w => {
        janelasEmRiscoHoje.add(w.name);
        if (!motivoAlerta) motivoAlerta = w.reason;
      });
    });

    const windows = calcWindows(deg, kmh, rain);
    const danger  = janelasEmRiscoHoje.size > 0;
    const toClose = [...janelasEmRiscoHoje];

    // Header color + theme-color meta
    const headerEl = document.getElementById("header");
    headerEl.className = `app-bg ${danger ? "danger" : "ok"}`;
    const themeColor = danger ? "#c0392b" : "#2563eb";
    document.getElementById("meta-theme").content = themeColor;
    try {
      localStorage.setItem("vw_theme", themeColor);
      localStorage.setItem("vw_danger", danger ? "1" : "0");
    } catch(_) {}

    // Alert banner
    const banner = document.getElementById("alert-banner");
    banner.className = `alert-banner ${danger ? "danger" : "ok"}`;
    document.getElementById("alert-icon").textContent  = danger ? "🌧️" : "☀️";
    document.getElementById("alert-title").textContent = danger
      ? "Vai chover! Feche as janelas."
      : "Não vai chover! Pode deixar as janelas abertas.";
    document.getElementById("alert-sub").textContent = danger
      ? `${motivoAlerta} · ${toClose.join(", ")}`
      : `Vento ${dirText} ${kmh} km/h`;

    // Timeline — calcula quantos itens cabem (mín 48px por item)
    const timelineEl = document.getElementById("timeline");
    const larguraDisp = timelineEl.parentElement.offsetWidth || window.innerWidth;
    const maxItens = Math.max(2, Math.min(6, Math.floor(larguraDisp / 48)));
    const timeline = gerarTimeline(data.list, maxItens);
    timelineEl.innerHTML = timeline.map(t =>
      `<div class="timeline-item">
        <div class="timeline-time">${t.label}</div>
        <div class="timeline-icon">${t.icon}</div>
        <div class="timeline-temp">${t.temp}</div>
      </div>`
    ).join("");

    // Window cards
    const grid = document.getElementById("windows-grid");
    grid.innerHTML = windows.map((w, i) => {
      const last = i === windows.length - 1 && windows.length % 2 !== 0;
      return `
        <div class="window-card glass ${w.close ? "danger" : ""}${last ? " full-width" : ""}">
          <div class="wc-icon">${w.icon}</div>
          <div class="wc-name">${w.name}</div>
          <div class="wc-status">${w.close ? "❌ FECHAR" : "✅ Aberta"}</div>
          ${w.reason ? `<div class="wc-reason">${w.reason}</div>` : ""}
        </div>`;
    }).join("");

    // Updated time
    const now = new Date();
    const timeStr = now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    document.getElementById("updated-time").textContent =
      cacheNote ? `⚠️ ${cacheNote}` : `Atualizado às ${timeStr}`;

    show("app");
  }

  // ── Init ───────────────────────────────────────────────────────

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  // Auto-refresh every 30 min when tab is visible
  setInterval(() => {
    if (!document.hidden) carregar();
  }, 30 * 60 * 1000);

  // Limpa cache antigo (formato /weather sem data.list)
  try {
    const raw = localStorage.getItem("vw_cache");
    if (raw) {
      const { data } = JSON.parse(raw);
      if (!data.list) localStorage.removeItem("vw_cache");
    }
  } catch (_) { localStorage.removeItem("vw_cache"); }

  // Start
  if (!getConfig().apiKey) {
    document.getElementById("loading").classList.remove("active");
    mostrarSetup();
  } else {
    carregar();
  }
</script>
</body>
</html>
